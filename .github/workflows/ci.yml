name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Format
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Build CLI
        run: go build ./cmd/claude-bridge
